<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style type="text/css">
        @media only screen and (max-width: 600px) {
            .email-container { width: 100% !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f3f3; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f3f3f3;">
        <tr>
            <td align="center" style="padding: 20px 10px;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" class="email-container" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; max-width: 600px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 25px 40px; background-color: #121212;">
                            <a href="https://shop.bobbyseamoss.com">
                                <img src="https://shop.bobbyseamoss.com/cdn/shop/files/Logo_Clean_Drop_Shadow.webp?v=1756858523&width=600" alt="Bobby Seamoss" width="180" style="display: block; max-width: 180px; height: auto;">
                            </a>
                        </td>
                    </tr>
                    <!-- Hero Section -->
                    <tr>
                        <td style="padding: 0;">
                            <div style="background: linear-gradient(135deg, #e03d96 0%, #121212 100%); padding: 50px 40px; text-align: center;">
                                <h1 style="margin: 0 0 10px 0; color: #ffffff; font-size: 36px; line-height: 1.2; text-transform: uppercase;">{{hero_headline}}</h1>
                                <p style="margin: 0 0 20px 0; color: #ffffff; font-size: 18px; opacity: 0.9;">{{hero_subheadline}}</p>
                                <div style="background-color: rgba(255,255,255,0.2); display: inline-block; padding: 10px 25px; border-radius: 50px;">
                                    <span style="color: #ffffff; font-size: 16px; font-weight: bold;">{{hero_badge}}</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!-- Main Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <div style="background-color: #f9f9f9; padding: 15px; margin-bottom: 25px; border-radius: 4px; font-size: 14px; color: #666; border-left: 4px solid #e03d96;">
                                <strong>Subject:</strong> {{subject}}<br>
                                <strong>Preview:</strong> {{preview}}
                            </div>
                            <div style="line-height: 1.6; color: #121212; font-size: 16px;">
                                {{body}}
                            </div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background-color: #121212; text-align: center;">
                            <p style="margin: 0 0 20px 0; color: #999; font-size: 12px;">
                                Bobby Seamoss | 2855 E 130th St Unit 20007, Cleveland, Ohio 44120
                            </p>
                            <p style="margin: 0; color: #999; font-size: 12px;">
                                <a href="{% unsubscribe_link %}" style="color: #e03d96; text-decoration: none;">Unsubscribe</a> | 
                                <a href="{% manage_preferences_link %}" style="color: #e03d96; text-decoration: none;">Update Preferences</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
